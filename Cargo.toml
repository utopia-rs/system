[package]
name = "utopia-system"
description = "Environment variables and machine facts: OS, architecture, CPU, memory, disk, IO and network."
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "BSD-3-Clause"

[dependencies]
indexmap = "2"
php-std = { version = "0.1.0", git = "https://github.com/utopia-rs/php-std" }
rustix = { version = "1", default-features = false, features = ["std", "fs", "system"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }

[package.metadata.utopia]
php-sync = "809d2819d7da00d8b2f486e3bcb4c98a5265e950"